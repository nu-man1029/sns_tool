<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>アニメーション絵文字スタジオ</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<!-- ===== モード選択モーダル ===== -->
<div id="mode-modal" class="modal-overlay">
  <div class="modal-card">
    <h1 class="modal-title">作るものを選んでください</h1>
    <p class="modal-sub">サイズ・ファイル名・容量ルールが切り替わります</p>
    <div class="mode-options">
      <button class="mode-btn" data-mode="sticker">
        <div class="mode-icon">🎨</div>
        <div class="mode-name">アニメーションスタンプ</div>
        <div class="mode-spec">320×270px / 1個300KB以下<br>ファイル名: 01.png〜40.png</div>
      </button>
      <button class="mode-btn" data-mode="emoji">
        <div class="mode-icon">😊</div>
        <div class="mode-name">アニメーション絵文字</div>
        <div class="mode-spec">240×240px / 1個1MB以下<br>ファイル名: 001.png〜040.png</div>
      </button>
    </div>
  </div>
</div>

<!-- ===== ヘッダー ===== -->
<header class="app-header">
  <div class="header-left">
    <span class="brand-mark">●</span>
    <span class="brand-name">EMOJI STUDIO</span>
    <span class="mode-badge" id="mode-badge">未選択</span>
  </div>
  <div class="header-right">
    <span class="save-status" id="save-status">— 未保存 —</span>
  </div>
</header>

<!-- ===== メイン ===== -->
<main class="app-main">

  <!-- アップロードゾーン -->
  <section class="upload-section">
    <div class="upload-zone" id="upload-zone">
      <div class="upload-inner">
        <div class="upload-icon">⬆</div>
        <div class="upload-text">
          ここに画像（PNG）またはZIPをドラッグ＆ドロップ<br>
          <span class="upload-sub">またはクリックしてファイル選択（最大40枚）</span>
        </div>
        <input type="file" id="file-input" accept="image/png,application/zip,.zip" multiple hidden>
      </div>
    </div>
    <div class="upload-info">
      <span id="upload-count">0 / 40 枚</span>
      <button class="btn-clear" id="btn-clear">すべてクリア</button>
    </div>
  </section>

  <!-- 40スロットグリッド -->
  <section class="grid-section">
    <div class="grid-header">
      <h2 class="grid-title">スロット一覧</h2>
      <div class="grid-legend">
        <span class="legend-item"><span class="dot dot-empty"></span>未設定</span>
        <span class="legend-item"><span class="dot dot-editing"></span>設定中</span>
        <span class="legend-item"><span class="dot dot-done"></span>確認済</span>
      </div>
    </div>
    <div class="slot-grid" id="slot-grid"></div>
  </section>

</main>

<!-- ===== フッター ===== -->
<footer class="app-footer">
  <button class="btn-primary" id="btn-download-all" disabled>一括ダウンロード（ZIP）</button>
</footer>

<!-- ===== 編集モーダル (Phase 2: Canvasアニメ) ===== -->
<div id="edit-modal" class="modal-overlay hidden">
  <div class="modal-card edit-card">
    <header class="edit-header">
      <div class="edit-title-block">
        <span class="edit-slot-num" id="edit-slot-num">スロット 01</span>
        <span class="edit-mode-info" id="edit-mode-info">— —</span>
      </div>
      <button class="edit-close" id="edit-close" aria-label="閉じる">×</button>
    </header>

    <div class="edit-body">
      <!-- Left: Canvas Preview -->
      <div class="edit-preview">
        <div class="canvas-wrap">
          <canvas id="edit-canvas" width="320" height="270"></canvas>
        </div>
        <div class="preview-controls">
          <button class="ctrl-btn" id="btn-play" type="button">▶ 再生</button>
          <button class="ctrl-btn" id="btn-restart" type="button" title="先頭から再生">⟲</button>
          <span class="frame-info" id="frame-info">0.00s</span>
        </div>
        <p class="preview-note">※ プレビューはブラウザ描画です。書き出しはPhase3以降。</p>
      </div>

      <!-- Right: Settings -->
      <div class="edit-settings">
        <!-- AI 提案 (Phase 3) -->
        <div class="setting-group ai-suggest">
          <div class="ai-suggest-header">
            <label class="setting-label">
              AIに動きを提案させる
              <span class="setting-value">Vision API</span>
            </label>
            <button type="button" class="ai-suggest-btn" id="btn-ai-suggest">
              <span class="ai-icon">✨</span>
              <span class="ai-btn-text">3案を提案</span>
            </button>
          </div>
          <div class="ai-suggest-body" id="ai-suggest-body" hidden></div>
        </div>

        <div class="setting-group">
          <label class="setting-label">アニメーションプリセット</label>
          <div class="anim-presets" id="anim-presets">
            <button type="button" class="preset-btn" data-preset="none">なし</button>
            <button type="button" class="preset-btn" data-preset="bounce">バウンス</button>
            <button type="button" class="preset-btn" data-preset="shake">シェイク</button>
            <button type="button" class="preset-btn" data-preset="pulse">パルス</button>
            <button type="button" class="preset-btn" data-preset="rotate">回転</button>
            <button type="button" class="preset-btn" data-preset="fade">フェード</button>
            <button type="button" class="preset-btn" data-preset="slide-x">横スライド</button>
            <button type="button" class="preset-btn" data-preset="zoom">ズーム</button>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label">
            再生時間
            <span class="setting-value" id="duration-value">800 ms</span>
          </label>
          <input type="range" id="duration-slider" min="200" max="3000" step="100" value="800">
        </div>

        <div class="setting-group">
          <label class="setting-label">
            強度
            <span class="setting-value" id="intensity-value">100 %</span>
          </label>
          <input type="range" id="intensity-slider" min="20" max="200" step="10" value="100">
        </div>

        <div class="setting-group">
          <label class="setting-label">
            フレームレート
            <span class="setting-value" id="fps-value">12 fps</span>
          </label>
          <input type="range" id="fps-slider" min="6" max="30" step="2" value="12">
        </div>

        <div class="setting-meta" id="setting-meta">
          総フレーム数: <span id="total-frames">10</span>
        </div>
      </div>
    </div>

    <footer class="edit-footer">
      <button type="button" class="btn-secondary" id="btn-edit-cancel">キャンセル</button>
      <button type="button" class="btn-primary" id="btn-edit-save">確定</button>
    </footer>
  </div>
</div>

<!-- ===== JS ===== -->
<script src="js/uploader.js"></script>
<script src="js/animator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
